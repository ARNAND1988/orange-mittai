services:
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: always
    expose:
      - "8080"

  api:
    build: ./backend
    restart: always
    env_file: .env.pi
    ports:                # local-only debug
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: orangemittai
      POSTGRES_USER: orangemittai
      POSTGRES_PASSWORD: orangemittai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/insert.sql:/docker-entrypoint-initdb.d/02_insert.sql:ro

volumes:
  pgdata:
